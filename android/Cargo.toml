[package]
name = "zcb_android"
version = "3.6.18"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
bot = { path = "../bot" }
egui_clickpack_db = { path = "../egui_clickpack_db" }
eframe = { path = "eframe_shim" }
egui = "0.36"
egui_glow = { version = "0.36", default-features = false }
egui_extras = { version = "0.36", features = ["image"] }
egui-modal = { git = "https://github.com/zeozeozeo/egui-modal.git", branch = "egui-0.36" }
egui_plot = "0.37.0"
image = { version = "0.25.6", default-features = false, features = ["png"] }
poll-promise = { version = "0.3", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
ureq = "3.1.4"
chrono = "0.4"
timeago = "0.5.0"
tempfile = "3.24.0"
rustmatica = "0.2.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
fastrand = "2.3.0"
android_logger = "0.14"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
