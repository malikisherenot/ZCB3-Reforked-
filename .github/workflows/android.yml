name: Build ZCB Android
on: [workflow_dispatch]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - run: cargo install cargo-ndk
      - run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a build --release -p zcb_android
          mkdir -p mod/libs/android64 mod/libs/android32
          cp target/aarch64-linux-android/release/libzcb_android.a mod/libs/android64/
          cp target/armv7-linux-androideabi/release/libzcb_android.a mod/libs/android32/
      - uses: actions/upload-artifact@v4
        with: { name: rust-libs, path: mod/libs }
  mod:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: rust-libs, path: mod/libs }
      - uses: geode-sdk/build-geode-mod@main
        with:
          sdk: nightly
          path: mod
          combine: true
          target: Android64
